services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${AGROMALL_DB_NAME:?AGROMALL_DB_NAME is required}
      MYSQL_USER: ${AGROMALL_DB_USERNAME:?AGROMALL_DB_USERNAME is required}
      MYSQL_PASSWORD: ${AGROMALL_DB_PASSWORD:?AGROMALL_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${AGROMALL_DB_ROOT_PASSWORD:?AGROMALL_DB_ROOT_PASSWORD is required}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${AGROMALL_REDIS_PASSWORD:?AGROMALL_REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
