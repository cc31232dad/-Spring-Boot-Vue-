agromall:
  environment: dev
  payment:
    sandbox-secret: ${AGROMALL_SANDBOX_PAYMENT_SECRET:local-sandbox-secret}
  redis:
    key-prefix: "agromall:dev:"
  upload:
    product-dir: ${AGROMALL_UPLOAD_PRODUCT_DIR:uploads/products}
spring:
  datasource:
    url: ${AGROMALL_DB_URL:jdbc:mysql://localhost:3306/agromall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${AGROMALL_DB_USERNAME:agromall}
    password: ${AGROMALL_DB_PASSWORD}
  data.redis:
    host: ${AGROMALL_REDIS_HOST:localhost}
    port: ${AGROMALL_REDIS_PORT:6379}
    password: ${AGROMALL_REDIS_PASSWORD}
