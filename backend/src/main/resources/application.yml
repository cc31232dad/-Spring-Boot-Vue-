spring:
  config:
    import: "optional:file:../.env[.properties]"
  profiles:
    default: dev
  application.name: agricultural-mall
  flyway.enabled: true
server.port: ${SERVER_PORT:8080}
agromall:
  payment:
    sandbox-secret: ${AGROMALL_SANDBOX_PAYMENT_SECRET}
  redis:
    key-prefix: "agromall:dev:"
  upload:
    product-dir: uploads/products
agromall.jwt:
  secret: ${AGROMALL_JWT_SECRET}
  access-token-minutes: 30
